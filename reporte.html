<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Ayuda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>    
    <h1>Formulario de Ayuda y Reportes</h1>
    <p>Completa los siguientes datos:</p>

    <form id="formReporte">
        <p>
            <label>Nombre:</label><br>
            <input type="text" name="nombre" placeholder="Escribe tu nombre" required>
        </p>

        <p>
            <label>Correo:</label><br>
            <input type="email" name="correo" placeholder="Escribe tu correo" required>
        </p>

        <p>
            <label>Tipo de reporte:</label><br>
            <select name="asunto" required>
                <option>Fallo en la página</option>
                <option>Duda sobre una donación</option>
                <option>Otro motivo</option>
            </select>
        </p>

        <p>
            <label>Detalle del problema:</label><br>
            <textarea name="mensaje" rows="4" cols="30" placeholder="Explica qué sucedió" required></textarea>
        </p>

        <button type="submit">Enviar Reporte</button>
    </form>

    <!-- Toast de Bootstrap -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toastReporte" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">SegundaOportunidAPP</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Cerrar"></button>
            </div>
            <div class="toast-body" id="mensajeToastReporte">
                Tu reporte se ha enviado correctamente.
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/toad.js"></script>
</body>
</html>
