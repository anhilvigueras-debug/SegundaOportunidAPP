<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios - SegundaOportunidAPP</title>
    
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
   
    <main>
        <div class="container mt-5 mb-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <h2 class="mb-4">Publicar un Artículo </h2>
                    <p class="text-muted mb-4">Por favor, llena los datos de tu artículo. <strong>Recuerda que si es donación, el precio debe quedar vacío.</strong></p>
                    
                    <form action="#" method="POST">
                       
                        <div class="mb-3">
                            <label for="fotoArticulo" class="form-label">Subir fotos del artículo</label>
                            <input class="form-control" type="file" id="fotoArticulo" accept="image/*" required>
                        </div>

                        
                        <div class="mb-3">
                            <label for="categoria" class="form-label">Categoría</label>
                            <select class="form-select" id="categoria" required>
                                <option value="" disabled selected>Elige una opción...</option>
                                <option value="ropa">Ropa y Accesorios</option>
                                <option value="muebles">Muebles y Hogar</option>
                                <option value="electronicos">Electrónicos</option>
                                <option value="libros">Libros y Papelería</option>
                            </select>
                        </div>

                      
                        <div class="mb-3">
                            <label class="form-label d-block">Tipo de publicación</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="tipoPublicacion" id="donacion" value="donacion" required>
                                <label class="form-check-label" for="donacion">Donación</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="tipoPublicacion" id="venta" value="venta" required>
                                <label class="form-check-label" for="venta">Venta con precio</label>
                            </div>
                        </div>

                        
                        <div class="mb-3">
                            <label for="precio" class="form-label">Precio establecido (si es venta)</label>
                            <input type="number" class="form-control" id="precio" min="0" step="0.50" placeholder="Ej. 150.00">
                        </div>

                       
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-secondary w-50">Cancelar</button>
                            <button type="submit" class="btn btn-primary w-50">Publicar</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
</body>
</html>
