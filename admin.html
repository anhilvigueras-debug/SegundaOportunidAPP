<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SegundaOportunidAPP - Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">SegundaOportunidAPP</a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="container my-4">
        <h1 class="mb-1">Panel de administración</h1>
        <p class="text-muted">Sección solo para administradores.</p>

        <section aria-label="Resumen de venta y regalías">
            <h2 class="h4 mb-3">Resumen de venta y regalías</h2>
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th scope="col">Artículo</th>
                            <th scope="col">Fecha</th>
                            <th scope="col">Precio de venta</th>
                            <th scope="col">Regalía (%)</th>
                            <th scope="col">Monto de regalía</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
